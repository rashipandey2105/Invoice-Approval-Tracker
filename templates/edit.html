<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Invoice</title>
</head>

<body>

    <h1>Edit Invoice</h1>

    <form action="/edit/{{ invoice.id }}" method="POST">

        <label>Invoice Number:</label>
        <input type="text"
               name="invoice_number"
               value="{{ invoice.invoice_number }}"
               required>

        <br><br>

        <label>Client Name:</label>
        <input type="text"
               name="client_name"
               value="{{ invoice.client_name }}"
               required>

        <br><br>

        <label>Amount:</label>
        <input type="number"
               name="amount"
               step="0.01"
               min="0"
               value="{{ invoice.amount }}"
               required>

        <br><br>

        <label>Invoice Date:</label>
        <input type="date"
               name="invoice_date"
               value="{{ invoice.invoice_date }}"
               required>

        <br><br>

        <label>Due Date:</label>
        <input type="date"
               name="due_date"
               value="{{ invoice.due_date }}"
               required>

        <br><br>

        <button type="submit">Update Invoice</button>

    </form>

    <br>

    <a href="/">Back to Invoices</a>

</body>

</html>
