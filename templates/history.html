<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invoice History</title>
</head>

<body>

    <h1>Invoice Status History</h1>

    <table border="1">

        <tr>
            <th>Old Status</th>
            <th>New Status</th>
            <th>Changed By</th>
            <th>Changed At</th>
        </tr>

        {% for item in history %}

        <tr>
            <td>{{ item.old_status }}</td>
            <td>{{ item.new_status }}</td>
            <td>{{ item.changed_by }}</td>
            <td>{{ item.changed_at }}</td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/">Back to Invoices</a>

</body>

</html>
